name: Build Standalone

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Prepare standalone artifact
        run: |
          mkdir -p standalone-artifact/.next
          cp -r .next/standalone/* standalone-artifact/
          cp -r .next/static standalone-artifact/.next/static
          cp -r public standalone-artifact/public

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone
          path: standalone-artifact
          if-no-files-found: error
